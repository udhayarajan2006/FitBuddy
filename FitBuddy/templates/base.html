<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07100d" />
  <title>{% block title %}FitBuddy AI{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <header class="topbar">
    <a class="brand" href="/" aria-label="FitBuddy home"><span class="brand-mark"><i data-lucide="sparkles"></i></span><span>FitBuddy</span><em>AI</em></a>
    <nav class="desktop-nav">
      <a class="nav-link active" href="/"><i data-lucide="layout-dashboard"></i> Dashboard</a>
      <a class="nav-link" href="/docs" target="_blank"><i data-lucide="code-2"></i> API Docs</a>
      <a class="nav-link" href="/view-all-users"><i data-lucide="shield"></i> Admin</a>
    </nav>
    <a class="mobile-home" href="/"><i data-lucide="home"></i></a>
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
  <footer><span>FitBuddy AI</span><span class="footer-dot"></span><span>Personal wellness planning</span><span class="footer-note">Not medical advice.</span></footer>
  <script src="{{ url_for('static', path='js/app.js') }}"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
